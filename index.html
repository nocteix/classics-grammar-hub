<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grammar Notes Viewer</title>
  <link rel="stylesheet" href="style.css">
  <!-- Fuse.js CDN for fuzzy search capability -->
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>
</head>
<body>

  <header>
    <h1>Classics Grammar Reference</h1>
    <div class="controls-wrapper">
      
      <!-- Search Input & Greek Character Toolbar -->
      <div class="search-container">
        <input type="text" id="searchInput" placeholder="Search titles, descriptions, formulas, or tags...">
        <div id="searchGreekToolbar" class="greek-toolbar"></div>
      </div>

      <!-- Language Filter Buttons -->
      <div class="filter-group">
        <span class="filter-label">Language:</span>
        <button class="lang-btn active" data-language="all">All</button>
        <button class="lang-btn" data-language="latin">Latin</button>
        <button class="lang-btn" data-language="greek">Greek</button>
      </div>

      <!-- Category Filter Buttons -->
      <div class="filter-group">
        <span class="filter-label">Category:</span>
        <button class="cat-btn active" data-category="all">All</button>
        <button class="cat-btn" data-category="syntax">Syntax</button>
        <button class="cat-btn" data-category="morphology">Morphology</button>
        <button class="cat-btn" data-category="vocabulary">Vocabulary</button>
      </div>

      <!-- Dynamic Tag Filter Bar -->
      <div class="filter-group">
        <span class="filter-label">Tags:</span>
        <div id="tagFilterContainer" class="tag-buttons-wrapper">
          <!-- Dynamically populated via script.js -->
        </div>
      </div>

      <!-- Export & Action Controls -->
      <div class="export-controls">
        <label class="toggle-container">
          <input type="checkbox" id="autoExportToggle">
          <span>Auto-download JSON on save</span>
        </label>
        <button id="exportLatinBtn" class="export-btn">Export Latin JSON</button>
        <button id="exportGreekBtn" class="export-btn">Export Greek JSON</button>
        <button id="openModalBtn" class="add-btn">+ Add Note</button>
      </div>

    </div>
  </header>

  <!-- Main Grid Content -->
  <main class="content">
    <div id="notesContainer" class="notes-grid">
      <!-- Grammar cards rendered dynamically via script.js -->
    </div>
  </main>

  <!-- Add / Edit Modal Window -->
  <div id="noteModal" class="modal-backdrop">
    <div class="modal-window">
      <div class="modal-header">
        <h2>Add New Grammar Note</h2>
        <button id="closeModalBtn" class="close-btn">&times;</button>
      </div>

      <form id="addNoteForm">
        <div class="form-row">
          <div class="form-group">
            <label for="noteLanguage">Language</label>
            <select id="noteLanguage" required>
              <option value="latin">Latin</option>
              <option value="greek">Greek</option>
            </select>
          </div>

          <div class="form-group">
            <label for="noteType">Category Type</label>
            <select id="noteType" required>
              <option value="syntax">Syntax</option>
              <option value="morphology">Morphology</option>
              <option value="vocabulary">Vocabulary</option>
            </select>
          </div>
        </div>

        <!-- Greek Special Characters Helper for Modal Inputs -->
        <div class="form-group">
          <div id="modalGreekToolbar" class="greek-toolbar"></div>
        </div>

        <div class="form-group">
          <label for="noteTitle">Title</label>
          <input type="text" id="noteTitle" placeholder="e.g., Ablative Absolute" required>
        </div>

        <div class="form-group">
          <label for="noteDescription">Description</label>
          <textarea id="noteDescription" rows="3" placeholder="Brief summary of the grammatical rule..." required></textarea>
        </div>

        <div class="form-group">
          <label for="noteFormula">Structure / Formula (Optional)</label>
          <input type="text" id="noteFormula" placeholder="e.g., Noun (Ablative) + Participle (Ablative)">
        </div>

        <div class="form-group">
          <label for="noteExamples">Examples (Optional)</label>
          <textarea id="noteExamples" rows="3" placeholder="Format each line as: Foreign Phrase | English Translation"></textarea>
          <small>One per line, separated by vertical bar (|)</small>
        </div>

        <div class="form-group">
          <label for="noteTags">Tags (Optional)</label>
          <input type="text" id="noteTags" placeholder="e.g., ablative, participle, syntax">
          <small>Comma-separated list</small>
        </div>

        <button type="submit" class="submit-btn">Save Grammar Note</button>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
